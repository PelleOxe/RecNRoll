<style>
:root{--bg:#f2f2f4;--fg:#111;--card:#fff;--ac:#d92d20;--mut:#667;--bd:#ccd}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.w{max-width:760px;margin:0 auto;padding:10px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:4px 0}small,.m{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.vw{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
video{width:100%;height:100%;object-fit:cover;display:block}
.ov{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 12px;color:#fff;background:linear-gradient(transparent,#000a);font-variant-numeric:tabular-nums}
.sp{font-size:44px;font-weight:700;line-height:1}.sp small{font-size:14px;color:#fff}
.rec{position:absolute;top:8px;left:10px;color:#fff;font-weight:700;display:none}
.rec.on{display:block}.rec:before{content:"● ";color:#f33;animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;flex:1;font-size:18px;padding:14px}
button.s{padding:6px 10px;font-size:14px}
select,input[type=number]{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
iframe{width:100%;height:220px;border:0;border-radius:8px;background:#888}
.clip{border-top:1px solid var(--bd);padding:8px 0}.clip:first-child{border:0}
dialog{border:0;border-radius:12px;max-width:94vw;background:var(--card);color:var(--fg)}
dialog video{max-width:100%;max-height:70vh}
footer{text-align:center;color:var(--mut);font-size:13px;padding:14px}

const m={name:"Rec'n'Roll – dashcam",short_name:"Rec'n'Roll",start_url:location.href.split('#')[0],display:'standalone',background_color:'#0f1012',theme_color:'#111111',icons:[{src:u,sizes:'192x192',type:'image/png'}]};
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();
// IndexedDB
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('dashcam',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(mode,fn)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('clips',mode),q=fn(t.objectStore('clips'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
// state
let stream,rec,cur,track=[],segTimer,recording=false,wl,pos,lastMap=0,lastTrk=0,t0;
const mime=()=>['video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
function newSeg(){
 const st=Date.now(),c=cur={locked:false},tr=track=[],ch=[],m=mime();
 const r=rec=new MediaRecorder(stream,m?{mimeType:m,videoBitsPerSecond:2500000}:{videoBitsPerSecond:2500000});
 r.ondataavailable=e=>e.data.size&&ch.push(e.data);
 r.onstop=async()=>{if(!ch.length)return;const b=new Blob(ch,{type:r.mimeType});
  await tx('readwrite',s=>s.put({id:st,start:st,end:Date.now(),mime:r.mimeType,blob:b,size:b.size,locked:c.locked,track:tr}));await rotate();render()};
 r.start(1000);
 segTimer=setTimeout(()=>{if(recording){r.stop();newSeg()}},+$('#seg').value*60000);
}
async function rotate(){const all=await tx('readonly',s=>s.getAll()),un=all.filter(c=>!c.locked).sort((a,b)=>a.start-b.start);let ex=un.length-(+$('#max').value||10);for(const c of un){if(ex--<=0)break;await tx('readwrite',s=>s.delete(c.id))}}
async function start(){
 if(!window.MediaRecorder){alert('Din webbläsare saknar MediaRecorder (kräver iOS 14.3+).');return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:$('#aud').checked})}catch(e){alert('Kameran kunde inte startas: '+e.message);return}
 $('#v').srcObject=stream;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 recording=true;t0=Date.now();newSeg();ui();
}
function stop(){recording=false;clearTimeout(segTimer);try{rec.stop()}catch(e){}stream&&stream.getTracks().forEach(t=>t.stop());$('#v').srcObject=null;try{wl&&wl.release()}catch(e){}ui()}
function ui(){$('#go').textContent=recording?'■ Stoppa':'● Starta inspelning';$('#evt').disabled=!recording;$('#rec').classList.toggle('on',recording)}
$('#go').onclick=()=>recording?stop():start();
$('#evt').onclick=()=>{if(cur){cur.locked=true;$('#evt').textContent='🔒 Låst!';setTimeout(()=>$('#evt').textContent='🔒 Händelse',1500)}};
document.addEventListener('visibilitychange',async()=>{if(recording&&document.visibilityState=='visible'){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}});
// klocka
setInterval(()=>{const d=new Date();$('#clk').textContent=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
 if(recording){const s=Math.floor((Date.now()-t0)/1000);$('#el').textContent=pad(Math.floor(s/60))+':'+pad(s%60)}},1000);
// GPS
navigator.geolocation&&navigator.geolocation.watchPosition(p=>{pos=p;const c=p.coords,v=c.speed;
 $('#spd').textContent=v!=null&&v>=0?Math.round(v*3.6):'–';$('#gps').textContent='GPS ±'+Math.round(c.accuracy)+' m';
 if(recording&&Date.now()-lastTrk>5000){lastTrk=Date.now();track.push({t:Date.now(),lat:c.latitude,lon:c.longitude,v:v!=null?Math.round(v*3.6):null})}
 if(Date.now()-lastMap>15000){lastMap=Date.now();$('#map').src=`https://maps.google.com/maps?q=${c.latitude},${c.longitude}&z=16&output=embed`}
},e=>$('#gps').textContent='GPS: '+e.message,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
$('#omap').onclick=()=>{if(pos)open(`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);else alert('Ingen GPS-position ännu.')};
function route(t){if(!t.length)return;const p=a=>a.lat+','+a.lon,n=t.length;if(n==1)return`https://www.google.com/maps?q=${p(t[0])}`;
 const w=[];const k=Math.min(8,n-2);for(let i=1;i<=k;i++)w.push(p(t[Math.round(i*(n-1)/(k+1))]));
 return`https://www.google.com/maps/dir/?api=1&origin=${p(t[0])}&destination=${p(t[n-1])}${w.length?'&waypoints='+w.join('|'):''}&travelmode=driving`}
// klipplista
const fmt=ms=>{const d=new Date(ms);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())};
async function render(){const all=(await tx('readonly',s=>s.getAll())).sort((a,b)=>b.start-a.start);let tot=0;const L=$('#list');L.innerHTML='';
 if(!all.length)L.innerHTML='<p class="m">Inga klipp ännu.</p>';
 all.forEach(c=>{tot+=c.size;const d=document.createElement('div');d.className='clip';const mx=Math.max(0,...c.track.map(p=>p.v||0));
  d.innerHTML=`<div>${c.locked?'🔒 ':''}<b>${fmt(c.start).replace('-',' ')}</b> <small>${Math.round((c.end-c.start)/1000)} s · ${(c.size/1048576).toFixed(1)} MB${c.track.length?' · max '+mx+' km/h':''}</small></div><div class="row" style="margin-top:6px"></div>`;
  const r=d.lastChild,B=(t,f)=>{const b=document.createElement('button');b.className='s';b.textContent=t;b.onclick=f;r.appendChild(b)};
  B('▶ Spela',()=>{$('#pv').src=URL.createObjectURL(c.blob);$('#dv').showModal()});
  B('⬇ Spara/Dela',()=>save(c));
  if(c.track.length)B('📍 Karta',()=>open(route(c.track)));
  B(c.locked?'Lås upp':'Lås',async()=>{c.locked=!c.locked;await tx('readwrite',s=>s.put(c));render()});
  B('🗑',async()=>{if(confirm('Radera klippet?')){await tx('readwrite',s=>s.delete(c.id));render()}});
  L.appendChild(d)});
 $('#used').textContent=all.length?`(${all.length} st, ${(tot/1048576).toFixed(0)} MB)`:''}
$('#dv').onclose=()=>{$('#pv').pause();URL.revokeObjectURL($('#pv').src)};
async function save(c){const f=new File([c.blob],'dashcam-'+fmt(c.start)+(c.mime.includes('mp4')?'.mp4':'.webm'),{type:c.mime.split(';')[0]});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}
// Dela app (QR: koppla in din vanliga QR-funktion som window.drawQR(el,url))
$('#shr').onclick=()=>{const u=location.href.split('#')[0];$('#url').textContent=u;$('#qr').innerHTML='';if(window.drawQR)window.drawQR($('#qr'),u);$('#ds').showModal()};
$('#nsh').onclick=()=>{const u=location.href.split('#')[0];navigator.share?navigator.share({title:"Rec'n'Roll – dashcam",url:u}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(u)};
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
render();
</script></body></html>
